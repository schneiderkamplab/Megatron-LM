name: qwen2_1.5b_sharded

train:
  train_iters: 100
  global_batch_size: 2
  micro_batch_size: 1

models:
  - name: qwen2-1.5b-sharded
    hf_id: Qwen/Qwen2-1.5B
    tp: 2
    pp: 1
    seq_length: 512

replicators:
  - strategy: none
  - strategy: full
  - strategy: demo
    topk: 32
    chunk: 64
    decay: 0.999

hardware:
  - nodes: 1
    gpus_per_node: 2